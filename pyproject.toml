[project]
name = "tetherd"
version = "0.1.0"
description = "Keeps containers attached to the network of the container they route through, such as a VPN sidecar."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Phil Barker" }]
keywords = ["docker", "vpn", "unraid", "gluetun", "networking", "container"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "docker>=7.1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "typer>=0.15",
    "apprise>=1.9",
]

[project.scripts]
tetherd = "tetherd.cli:app"

[project.urls]
Homepage = "https://github.com/Phil-Barker/tetherd"
Issues = "https://github.com/Phil-Barker/tetherd/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tetherd"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # import sorting
    "N",      # naming
    "UP",     # pyupgrade
    "B",      # bugbear
    "A",      # builtin shadowing
    "C4",     # comprehensions
    "DTZ",    # timezone-aware datetimes
    "T20",    # no print in library code
    "PT",     # pytest style
    "RET",    # return simplification
    "SIM",    # simplification
    "PTH",    # prefer pathlib
    "TRY",    # exception antipatterns
    "RUF",
]
ignore = [
    "TRY003",  # long messages outside exception classes; we prefer readable errors
]

[tool.ruff.lint.per-file-ignores]
# The CLI is the one place printing to stdout is the point, and Typer's
# recommended default of typer.Option() in argument lists trips B008.
"src/tetherd/cli.py" = ["T20", "B008"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
pretty = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Neither ships type information.
module = ["docker.*", "apprise.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a live Docker daemon; deselect with -m 'not integration'",
]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
